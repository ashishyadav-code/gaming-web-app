[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

# Route /api/* to Netlify Functions (optional prefix alias)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
